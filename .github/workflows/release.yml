name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  # ── Step 1: create the GitHub Release draft once ───────────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Read app version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release draft
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.tag.outputs.tag }}';
            const version = '${{ steps.version.outputs.version }}';
            // Delete any existing release for this tag so re-runs don't fail
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner, repo: context.repo.repo, tag,
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner, repo: context.repo.repo,
                release_id: existing.data.id,
              });
            } catch (_) {}
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Ipsacarta v${version}`,
              body: [
                'See [RELEASES.md](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/blob/main/RELEASES.md) for full changelog.',
                '',
                '**Downloads**',
                '| Platform | File |',
                '|----------|------|',
                '| Linux (Ubuntu/Debian) | `.deb`, `.AppImage` |',
                '| Windows | `.msi`, `.exe` |',
                '| macOS | `.dmg` (universal — Intel + Apple Silicon) |',
              ].join('\n'),
              draft: true,
              prerelease: false,
            });
            return data.id;

  # ── Step 2: build on each platform and upload to the release ───────────────
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            args: ''
            bundle-dir: target/release/bundle

          - platform: windows
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            args: ''
            bundle-dir: target/release/bundle

          - platform: macos
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            bundle-dir: target/universal-apple-darwin/release/bundle

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload artifacts to release (Linux)
        if: matrix.platform == 'linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.create-release.outputs.tag }} \
            ${{ matrix.bundle-dir }}/deb/*.deb \
            ${{ matrix.bundle-dir }}/appimage/*.AppImage \
            --clobber

      - name: Upload artifacts to release (Windows)
        if: matrix.platform == 'windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.create-release.outputs.tag }} `
            (Get-ChildItem ${{ matrix.bundle-dir }}/msi/*.msi).FullName `
            (Get-ChildItem ${{ matrix.bundle-dir }}/nsis/*.exe).FullName `
            --clobber

      - name: Upload artifacts to release (macOS)
        if: matrix.platform == 'macos'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.create-release.outputs.tag }} \
            ${{ matrix.bundle-dir }}/dmg/*.dmg \
            --clobber
